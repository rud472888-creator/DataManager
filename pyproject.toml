[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "footage-data-manager"
version = "0.1.0"
description = "macOS local runtime with a REST/WebSocket remote console for field footage offload"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "httpx>=0.27",
  "mypy>=1.10",
  "playwright>=1.45",
  "pytest>=8.2",
  "ruff>=0.6",
]

[project.scripts]
fdm-server = "app.main:main"

[tool.setuptools]
packages = [
  "app",
  "app.api",
  "app.local_panel",
  "app.parsers",
  "app.persistence",
  "app.runtime",
  "app.web_console",
]

[tool.setuptools.package-data]
app = ["web_console/*.html", "web_console/*.css", "web_console/*.js", "persistence/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
  ".codex",
  ".fdm_data",
  ".git",
  ".mypy_cache",
  ".omx",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
  ".venv.backup-*",
  ".venv.broken-*",
  ".venv.py39-*",
  "build",
  "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
